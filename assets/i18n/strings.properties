controls.clutchHelp=Cómo se pisa el embrague: mantén {0} para pisarlo a fondo (baja en 0,2 s). Al soltar {0} el pedal sube despacio (0,6 s hasta arriba): el punto de fricción, donde el coche empieza a moverse, está más o menos a mitad de recorrido (la franja ámbar de la barra del embrague). Para arrancar sin calar: primera, quita el freno de mano, mantén {1} (deja el embrague justo en el punto de fricción), da un poco de gas con {2} y cuando el coche se mueva suelta {1}. Con el teclado el acelerador ({2}) se pisa poco a poco mientras mantienes la tecla: para salir basta un toque corto, y en este diésel el coche incluso avanza sin gas si sueltas el embrague despacio. Para cambiar de marcha: {0}, la marcha, y suelta {0}.
controls.foot={0} cierra esta ayuda. Las teclas se cambian en Ajustes > Controles.

